<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profit & Loss Calculator | Ajayds.com</title>
    <link href="./output.css" rel="stylesheet">
    <link rel="icon" href="https://ajayds.com/wp-content/uploads/2025/10/ajayds-.com-1-150x150.png" sizes="32x32">
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" defer></script>
</head>

<body>

    <div class="bg-gray-50 text-gray-800">
        <div class="max-w-5xl mx-auto p-6">
            <div class="bg-white rounded-2xl shadow-md p-6 border-t-4 border-green-600 mb-6">
                <h1 class="text-3xl font-semibold mb-2">💼 Profit & Loss Calculator</h1>
                <p class="text-gray-600">Real-time financial insights for your business</p>
            </div>

            <div class="grid md:grid-cols-2 gap-6 mb-6">
                <div class="bg-white rounded-xl shadow-sm p-5">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="text-lg font-semibold text-gray-800">Revenue Streams</h2>
                        <button id="addRevenue"
                            class="bg-green-600 text-white px-3 py-1.5 rounded-md hover:bg-green-700">+
                            Add</button>
                    </div>
                    <div id="revenueList" class="space-y-3"></div>
                </div>

                <div class="bg-white rounded-xl shadow-sm p-5">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="text-lg font-semibold text-gray-800">Expense Categories</h2>
                        <button id="addExpense" class="bg-red-600 text-white px-3 py-1.5 rounded-md hover:bg-red-700">+
                            Add</button>
                    </div>
                    <div id="expenseList" class="space-y-3"></div>
                </div>
            </div>

            <div class="grid md:grid-cols-3 gap-6 mb-6">
                <div class="bg-white rounded-xl shadow-sm p-5">
                    <h3 class="text-lg font-semibold mb-3 text-gray-800 text-center">Revenue vs Expenses</h3>
                    <canvas id="breakdownChart" class="mt-12 w-full min-h-[150px]"></canvas>
                </div>
                <div class="bg-white rounded-xl shadow-sm p-5">
                    <h3 class="text-lg font-semibold mb-3 text-gray-800 text-center">Expense Distribution</h3>
                    <canvas id="distributionChart" class="w-full max-h-[260px]"></canvas>
                </div>
                <div class="bg-white rounded-xl shadow-sm p-5">
                    <h3 class="text-lg font-semibold mb-3 text-gray-800 text-center">Revenue Distribution</h3>
                    <canvas id="profitBreakdownChart" class="w-full max-h-[260px]"></canvas>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm p-5 mb-6">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-semibold text-gray-800">Financial Summary</h2>
                    <button id="downloadPDF"
                        class="bg-blue-600 text-white px-3 py-1.5 rounded-md hover:bg-blue-700 text-sm">Download
                        PDF</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full border border-gray-200 text-sm">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="text-left px-3 py-2 border-b">Category</th>
                                <th class="text-right px-3 py-2 border-b">Amount ($)</th>
                            </tr>
                        </thead>
                        <tbody id="summaryTable"></tbody>
                        <tfoot class="bg-gray-50 font-semibold">
                            <tr>
                                <td class="px-3 py-2 border-t">Total Revenue</td>
                                <td id="totalRevenue" class="text-right px-3 py-2 border-t text-green-600">$0</td>
                            </tr>
                            <tr>
                                <td class="px-3 py-2 border-t">Total Expenses</td>
                                <td id="totalExpenses" class="text-right px-3 py-2 border-t text-red-600">$0</td>
                            </tr>
                            <tr>
                                <td class="px-3 py-2 border-t">Net Profit</td>
                                <td id="netProfit" class="text-right px-3 py-2 border-t text-emerald-600">$0</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts/profit-loss-calculator.js" defer></script>
</body>

</html>
